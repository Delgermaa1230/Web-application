services:
  - type: web
    name: numteach-api
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
